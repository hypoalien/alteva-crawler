# Isolated verification project: fresh volumes and alternate loopback ports.
# Requires Docker Compose >= 2.24.4 for !override; main application data is untouched.
services:
  web:
    ports: !override ["127.0.0.1:3100:3000"]
  api:
    ports: !override ["127.0.0.1:5180:8080"]
    environment:
      ConnectionStrings__Crawler: Host=postgres;Database=crawler;Username=crawler;Password=crawler-local;Timeout=3;Command Timeout=10
  worker:
    ports: !override ["127.0.0.1:5181:8080"]
    environment:
      ConnectionStrings__Crawler: Host=postgres;Database=crawler;Username=crawler;Password=crawler-local;Timeout=3;Command Timeout=10
  postgres:
    ports: !override ["127.0.0.1:55433:5432"]
  rabbitmq:
    ports: !override ["127.0.0.1:5674:5672", "127.0.0.1:15674:15672"]
  fixtures:
    ports: !override ["127.0.0.1:5190:8090"]
