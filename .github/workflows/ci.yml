name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore Crawler.sln --locked-mode

      - name: Build backend
        run: dotnet build Crawler.sln --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test Crawler.sln --configuration Release --no-build --no-restore

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck

      - name: Build frontend
        working-directory: web
        run: npm run build

  smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: alteva-audit
      COMPOSE_FILE: compose.yaml:compose.fixture.yaml:compose.audit.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Start complete application
        run: |
          mkdir -p artifacts
          docker compose up --build --detach 2>&1 | tee artifacts/compose-up.log

      - name: Run smoke checks
        run: python3 -u scripts/smoke.py 2>&1 | tee artifacts/smoke.log

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/compose.log 2>&1 || true

      - name: Save failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: artifacts/
          retention-days: 7

      - name: Destroy test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
